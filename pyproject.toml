[project]
name = "roadsense"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "imagehash>=4.3",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # formatter owns line length

[tool.pytest.ini_options]
pythonpath = ["."]
